<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WallFlixHub - Ringtones Admin Upload</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--bg:#030305;--text:#fff;--glass:rgba(15,15,30,.76);--grad:linear-gradient(135deg,#d72bd6,#7a22ff)}
body{margin:0;font-family:Inter,sans-serif;background:var(--bg);color:var(--text)}
header{padding:15px;background:var(--glass);display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:18px}
button{cursor:pointer;border:none;color:#fff;padding:8px 12px;border-radius:10px;background:var(--grad)}
.upload-section{padding:15px}
.ringtone-card{background:var(--glass);margin:10px 0;padding:12px;border-radius:16px;display:flex;align-items:center;gap:10px;justify-content:space-between}
.ringtone-card button{background:var(--grad);padding:6px 10px;font-size:14px;border-radius:12px}
.preview-card{margin:10px 0;padding:10px;border-radius:16px;background:var(--glass)}
input, select{width:100%;padding:10px;margin:6px 0;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(15,15,30,.5);color:#fff;outline:none}
</style>
</head>
<body>

<header>
<h1>WallFlixHub Admin - Ringtones</h1>
</header>

<div class="upload-section">
<h2>Upload Ringtone (Admin Only)</h2>
<input type="file" id="fileInput" accept="audio/mp3">
<input type="text" id="titleInput" placeholder="Ringtone Title">
<select id="catSelect">
<option>Anime</option>
<option>Gaming</option>
<option>Cars</option>
<option>Nature</option>
<option>AMOLED</option>
<option>Cyberpunk</option>
<option>Space</option>
<option>Abstract</option>
<option>Sports</option>
<option>Technology</option>
</select>
<button onclick="uploadRingtone()">Upload to Cloudinary</button>

<div id="previewContainer"></div>
</div>

<h2 style="padding:15px 15px 0 15px">Latest Ringtones</h2>
<div id="ringtonesList" style="padding:0 15px"></div>

<script>
let ringtones = [];

function renderRingtones() {
    const list = document.getElementById('ringtonesList');
    list.innerHTML = '';
    ringtones.forEach((r, i) => {
        const card = document.createElement('div');
        card.className = 'ringtone-card';
        card.innerHTML = `<span>${r.title} (${r.category})</span><audio controls src="${r.url}" style="flex:1"></audio>`;
        list.appendChild(card);
    });
}

function uploadRingtone() {
    const fileInput = document.getElementById('fileInput');
    const titleInput = document.getElementById('titleInput');
    const catSelect = document.getElementById('catSelect');

    if(!fileInput.files.length || !titleInput.value) {
        alert('Select MP3 and enter title.');
        return;
    }

    const file = fileInput.files[0];
    const title = titleInput.value;
    const category = catSelect.value;

    const preview = document.getElementById('previewContainer');
    preview.innerHTML = `<div class="preview-card">Preview: ${title}<br><audio controls src="${URL.createObjectURL(file)}"></audio></div>`;

    const simulatedUrl = URL.createObjectURL(file);
    ringtones.push({title, category, url: simulatedUrl});

    renderRingtones();

    fileInput.value = '';
    titleInput.value = '';
}
</script>

</body>
</html>
