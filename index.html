<!-- Firebase Config -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-analytics.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDLv0FWvThD7h6EnHMb-l9Tn0pfOLfbvGE",
  authDomain: "wallflixhub.firebaseapp.com",
  databaseURL: "https://wallflixhub-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "wallflixhub",
  storageBucket: "wallflixhub.firebasestorage.app",
  messagingSenderId: "621224536171",
  appId: "1:621224536171:web:dc3884c7d5c9026463692e",
  measurementId: "G-T6QZ6N8DDJ"
};
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
const db = getDatabase();

// Featured Wallpapers listener
const featuredRef = ref(db, 'wallpapers');
function renderFeatured(items) {
    const grid = document.getElementById('featuredGrid');
    grid.innerHTML = '';
    items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <img src="${item.url}" alt="${item.title}">
            <div class="card-stats">
                <button onclick="likeItem('${item.id}')">❤️ <span>${item.likes||0}</span></button>
                <button onclick="downloadItem('${item.url}')">⬇️</button>
                <button onclick="shareItem('${item.url}')">🔗</button>
            </div>
        `;
        grid.appendChild(card);
    });
}

onValue(featuredRef, snapshot => {
    const items = [];
    snapshot.forEach(child => {
        const data = child.val();
        if(data.featured) items.push({ id: child.key, ...data });
    });
    renderFeatured(items);
});

function likeItem(id){alert('Like clicked: '+id);}
function downloadItem(url){const a=document.createElement('a');a.href=url;a.download='wallpaper.jpg';a.click();}
function shareItem(url){navigator.clipboard.writeText(url);alert('Link copied to clipboard!');}
</script>
